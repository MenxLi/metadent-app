[project]
name = "metadent-tools"
version = "0.1.0"
description = "A collection of tools for the Metadent project."
readme = "README.md"
authors = [
    { name = "limengxun", email = "limengxun45@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "lfss>=0.18.0",
    "numpy>=2.2",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
